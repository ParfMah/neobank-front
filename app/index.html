<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#080c14"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="NeoBank"/>
<meta name="mobile-web-app-capable" content="yes"/>
<title>NeoBank — Application</title>
<link rel="manifest" href="manifest.json"/>
<link rel="apple-touch-icon" href="../assets/icons/icon-192.svg"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
/* ══════════════════════════════════════════════════════════
   NEOBANK APP — Design System
══════════════════════════════════════════════════════════ */
:root {
  --bg:       #080c14;
  --bg2:      #0d1424;
  --surface:  #111827;
  --card:     #151d2e;
  --border:   rgba(255,255,255,0.07);
  --cyan:     #00d4ff;
  --purple:   #7c3aed;
  --green:    #10b981;
  --red:      #ef4444;
  --warn:     #f59e0b;
  --text:     #f0f4ff;
  --text2:    #8892a4;
  --text3:    #4a5568;
  --grad:     linear-gradient(135deg, #00d4ff 0%, #7c3aed 100%);
  --grad-r:   linear-gradient(135deg, #7c3aed 0%, #00d4ff 100%);
  --card-grad:linear-gradient(135deg, #0f1f3d 0%, #1a1040 100%);
  --radius:   16px;
  --radius-sm:10px;
  --radius-xl:24px;
  --tab-h:    72px;
  --header-h: 60px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bot: env(safe-area-inset-bottom, 0px);
}
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html,body { height:100%; overflow:hidden; background:var(--bg); font-family:'Inter',sans-serif; color:var(--text); }
#app { position:fixed; inset:0; display:flex; flex-direction:column; overflow:hidden; background:var(--bg); }

/* ── Screen Container ─────────────────────────────── */
#screen-wrap {
  flex:1; overflow:hidden; position:relative;
  /* Pas de padding ici — géré directement sur .screen */
}
.screen {
  position:absolute; top:0; right:0; left:0; bottom:0;
  overflow-y:auto; overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  /* Padding suffisant pour que le dernier élément ne soit PAS caché sous la tab bar fixe */
  padding-bottom: calc(var(--tab-h) + var(--safe-bot) + 24px);
  transition: transform .35s cubic-bezier(.4,0,.2,1), opacity .35s ease;
}
.screen::-webkit-scrollbar { display:none; }
.screen.slide-in-right  { animation: slideInR .35s cubic-bezier(.4,0,.2,1) forwards; }
.screen.slide-in-left   { animation: slideInL .35s cubic-bezier(.4,0,.2,1) forwards; }
.screen.slide-out-left  { animation: slideOutL .35s cubic-bezier(.4,0,.2,1) forwards; }
.screen.slide-out-right { animation: slideOutR .35s cubic-bezier(.4,0,.2,1) forwards; }
@keyframes slideInR  { from{transform:translateX(100%);opacity:.7} to{transform:none;opacity:1} }
@keyframes slideInL  { from{transform:translateX(-100%);opacity:.7} to{transform:none;opacity:1} }
@keyframes slideOutL { from{transform:none} to{transform:translateX(-30%);opacity:0} }
@keyframes slideOutR { from{transform:none} to{transform:translateX(100%);opacity:0} }

/* ── Auth screens (no tab bar) ─────────────────────── */
.auth-screen {
  position:absolute; inset:0;
  overflow-y:auto; padding:0;
  display:flex; flex-direction:column;
  background:var(--bg);
}

/* ── Bottom Tab Bar ────────────────────────────────── */
#tab-bar {
  position:fixed; bottom:0; left:0; right:0; z-index:100;
  height: calc(var(--tab-h) + var(--safe-bot));
  padding-bottom: var(--safe-bot);
  background: rgba(8,12,20,0.92);
  backdrop-filter: blur(20px);
  border-top: 1px solid var(--border);
  display: flex; align-items: flex-start;
  padding-top: 8px;
}
#tab-bar.hidden { display:none; }
.tab-item {
  flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;
  padding:8px 4px; cursor:pointer; border:none; background:none;
  transition: all .2s; color: var(--text2);
  font-family:'Inter',sans-serif;
}
.tab-item.active { color: var(--cyan); }
.tab-icon { font-size:22px; line-height:1; transition: transform .2s; }
.tab-item.active .tab-icon { transform: translateY(-2px); }
.tab-label { font-size:10px; font-weight:600; letter-spacing:.02em; }
.tab-item.center-btn { margin-top:-16px; }
.tab-center-circle {
  width:52px; height:52px; border-radius:50%;
  background: var(--grad); display:flex; align-items:center; justify-content:center;
  box-shadow: 0 4px 20px rgba(0,212,255,.35);
  font-size:24px; transition: transform .2s, box-shadow .2s;
}
.tab-item.center-btn.active .tab-center-circle,
.tab-item.center-btn:hover .tab-center-circle {
  transform: scale(1.08);
  box-shadow: 0 6px 28px rgba(0,212,255,.5);
}

/* ── Header ────────────────────────────────────────── */
.app-header {
  position: sticky; top:0; z-index:50;
  background: rgba(8,12,20,0.85);
  backdrop-filter: blur(16px);
  padding: calc(var(--safe-top) + 12px) 20px 12px;
  display:flex; align-items:center; gap:12px;
  border-bottom: 1px solid var(--border);
}
.app-header h1 { font-family:'Space Grotesk',sans-serif; font-size:1.05rem; font-weight:700; flex:1; }
.back-btn {
  width:36px; height:36px; border-radius:50%;
  background:var(--surface); border:none; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  font-size:1.1rem; color:var(--text); flex-shrink:0;
}
.icon-btn {
  width:38px; height:38px; border-radius:50%;
  background:var(--surface); border:1px solid var(--border); cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  font-size:1.1rem; color:var(--text); flex-shrink:0;
  transition: background .2s;
}
.icon-btn:hover { background:var(--card); }

/* ── Cards ─────────────────────────────────────────── */
.card {
  background:var(--card); border:1px solid var(--border);
  border-radius:var(--radius); padding:20px;
}
.glass-card {
  background: rgba(21,29,46,0.7);
  backdrop-filter: blur(12px);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:var(--radius);
}

/* ── Balance Card ─────────────────────────────────── */
.balance-card {
  background: var(--card-grad);
  border:1px solid rgba(0,212,255,0.15);
  border-radius:var(--radius-xl);
  padding:24px;
  position:relative; overflow:hidden;
  margin:16px;
}
.balance-card::before {
  content:''; position:absolute; top:-60px; right:-40px;
  width:180px; height:180px; border-radius:50%;
  background:radial-gradient(circle, rgba(0,212,255,.2), transparent 70%);
}
.balance-card::after {
  content:''; position:absolute; bottom:-40px; left:20px;
  width:140px; height:140px; border-radius:50%;
  background:radial-gradient(circle, rgba(124,58,237,.15), transparent 70%);
}
.balance-label { font-size:.72rem; color:var(--text2); letter-spacing:.08em; text-transform:uppercase; margin-bottom:6px; }
.balance-amount {
  font-family:'Space Grotesk',sans-serif; font-size:2.6rem; font-weight:800;
  background:var(--grad); -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  background-clip:text; margin-bottom:4px;
}
.balance-iban { font-size:.75rem; color:rgba(255,255,255,.4); letter-spacing:.12em; margin-top:16px; }
.balance-row { display:flex; justify-content:space-between; align-items:flex-end; }

/* ── Quick Actions ────────────────────────────────── */
.quick-actions {
  display:flex; gap:8px; padding:0 16px 16px;
  overflow-x:auto; scrollbar-width:none;
}
.quick-actions::-webkit-scrollbar { display:none; }
.qa-btn {
  display:flex; flex-direction:column; align-items:center; gap:8px;
  flex-shrink:0; cursor:pointer; padding:4px;
  border:none; background:none; color:var(--text);
  transition: transform .2s;
}
.qa-btn:active { transform: scale(.93); }
.qa-icon {
  width:54px; height:54px; border-radius:var(--radius-sm);
  display:flex; align-items:center; justify-content:center;
  font-size:1.4rem; border:1px solid var(--border);
}
.qa-icon-cyan  { background:rgba(0,212,255,.1); border-color:rgba(0,212,255,.25); }
.qa-icon-purple{ background:rgba(124,58,237,.1); border-color:rgba(124,58,237,.25); }
.qa-icon-green { background:rgba(16,185,129,.1); border-color:rgba(16,185,129,.25); }
.qa-icon-warn  { background:rgba(245,158,11,.1); border-color:rgba(245,158,11,.25); }
.qa-label { font-size:.7rem; font-weight:600; color:var(--text2); }

/* ── Stats Mini ───────────────────────────────────── */
.stats-row {
  display:grid; grid-template-columns:1fr 1fr; gap:10px;
  padding:0 16px 16px;
}
.stat-mini {
  background:var(--card); border:1px solid var(--border);
  border-radius:var(--radius); padding:14px 16px;
}
.stat-mini-label { font-size:.7rem; color:var(--text2); margin-bottom:4px; }
.stat-mini-val { font-family:'Space Grotesk',sans-serif; font-size:1.15rem; font-weight:700; }

/* ── Chart Bars ───────────────────────────────────── */
.chart-wrap { padding:0 16px 16px; }
.chart-card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:18px; }
.chart-title { font-size:.8rem; font-weight:600; color:var(--text2); margin-bottom:14px; }
.chart-bars { display:flex; align-items:flex-end; gap:6px; height:70px; }
.chart-bar-wrap { flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; }
.chart-bar {
  width:100%; border-radius:4px;
  background:rgba(0,212,255,.15);
  transition: height .6s cubic-bezier(.4,0,.2,1);
  min-height:4px;
}
.chart-bar.today { background:var(--grad); }
.chart-day { font-size:.62rem; color:var(--text3); }

/* ── Transaction Items ────────────────────────────── */
.tx-section-title { font-size:.72rem; color:var(--text2); padding:12px 16px 6px; font-weight:600; text-transform:uppercase; letter-spacing:.06em; }
.tx-item {
  display:flex; align-items:center; gap:14px; padding:14px 16px;
  border-bottom:1px solid var(--border); cursor:pointer;
  transition: background .15s;
}
.tx-item:active { background:rgba(255,255,255,.03); }
.tx-icon-wrap {
  width:44px; height:44px; border-radius:50%; flex-shrink:0;
  display:flex; align-items:center; justify-content:center; font-size:1.2rem;
}
.tx-green { background:rgba(16,185,129,.12); }
.tx-red   { background:rgba(239,68,68,.12); }
.tx-blue  { background:rgba(0,212,255,.12); }
.tx-purple{ background:rgba(124,58,237,.12); }
.tx-info { flex:1; min-width:0; }
.tx-name { font-size:.88rem; font-weight:600; margin-bottom:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.tx-date { font-size:.72rem; color:var(--text2); }
.tx-amount { font-family:'Space Grotesk',sans-serif; font-size:.95rem; font-weight:700; text-align:right; flex-shrink:0; }
.tx-plus  { color:var(--green); }
.tx-minus { color:var(--text); }

/* ── Section Header ───────────────────────────────── */
.section-row { display:flex; justify-content:space-between; align-items:center; padding:8px 16px 0; }
.section-row h3 { font-size:.9rem; font-weight:700; }
.see-all { font-size:.78rem; color:var(--cyan); font-weight:600; cursor:pointer; background:none; border:none; }

/* ── Inputs ───────────────────────────────────────── */
.input-group { margin-bottom:14px; }
.input-label { font-size:.78rem; font-weight:600; color:var(--text2); margin-bottom:6px; display:block; }
.nb-input {
  width:100%; padding:14px 16px;
  background:var(--surface); border:1px solid var(--border);
  border-radius:var(--radius-sm); color:var(--text);
  font-size:.95rem; font-family:'Inter',sans-serif;
  transition:border-color .2s;
}
.nb-input:focus { outline:none; border-color:rgba(0,212,255,.4); background:rgba(0,212,255,.03); }
.nb-input::placeholder { color:var(--text3); }
.nb-input-wrap { position:relative; }
.nb-input-icon { position:absolute; right:14px; top:50%; transform:translateY(-50%); cursor:pointer; font-size:1.1rem; color:var(--text2); }
.input-row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }

/* ── Buttons ──────────────────────────────────────── */
.btn-primary {
  width:100%; padding:16px; border-radius:var(--radius); border:none;
  background:var(--grad); color:#fff; font-size:1rem; font-weight:700;
  font-family:'Space Grotesk',sans-serif; cursor:pointer;
  transition:transform .15s, box-shadow .15s;
  box-shadow:0 4px 20px rgba(0,212,255,.25);
}
.btn-primary:active { transform:scale(.97); box-shadow:0 2px 10px rgba(0,212,255,.2); }
.btn-primary:disabled { opacity:.5; cursor:not-allowed; transform:none; }
.btn-outline {
  width:100%; padding:14px; border-radius:var(--radius);
  border:1px solid var(--border); background:transparent;
  color:var(--text); font-size:.95rem; font-weight:600;
  font-family:'Inter',sans-serif; cursor:pointer; transition:all .2s;
}
.btn-outline:active { background:rgba(255,255,255,.05); }
.btn-ghost { background:none; border:none; color:var(--cyan); font-size:.9rem; font-weight:600; cursor:pointer; font-family:'Inter',sans-serif; }

/* ── Auth Pages ───────────────────────────────────── */
.auth-top {
  background:var(--card-grad);
  padding:calc(var(--safe-top) + 48px) 24px 48px;
  position:relative; overflow:hidden;
}
.auth-top::before {
  content:''; position:absolute; top:-80px; right:-60px;
  width:220px; height:220px; border-radius:50%;
  background:radial-gradient(circle, rgba(0,212,255,.2), transparent 70%);
}
.auth-logo { display:flex; align-items:center; gap:10px; margin-bottom:24px; }
.auth-logo-mark {
  width:44px; height:44px; border-radius:12px;
  background:var(--grad); display:flex; align-items:center; justify-content:center;
  font-size:1.3rem; box-shadow:0 4px 16px rgba(0,212,255,.3);
}
.auth-logo-text { font-family:'Space Grotesk',sans-serif; font-size:1.3rem; font-weight:800; }
.auth-title { font-family:'Space Grotesk',sans-serif; font-size:1.8rem; font-weight:800; line-height:1.2; }
.auth-sub { font-size:.88rem; color:rgba(255,255,255,.6); margin-top:8px; }
.auth-body { padding:28px 24px; flex:1; }
.auth-footer { padding:16px 24px calc(var(--safe-bot) + 20px); text-align:center; }
.auth-footer p { font-size:.83rem; color:var(--text2); }
.auth-footer a { color:var(--cyan); font-weight:600; cursor:pointer; }
.auth-divider { display:flex; align-items:center; gap:12px; margin:20px 0; }
.auth-divider span { font-size:.78rem; color:var(--text3); white-space:nowrap; }
.auth-divider::before,.auth-divider::after { content:''; flex:1; height:1px; background:var(--border); }
.alert-box {
  padding:12px 14px; border-radius:var(--radius-sm);
  font-size:.83rem; margin-bottom:14px;
  display:none;
}
.alert-error { background:rgba(239,68,68,.1); border:1px solid rgba(239,68,68,.3); color:#fca5a5; }
.alert-success { background:rgba(16,185,129,.1); border:1px solid rgba(16,185,129,.3); color:#6ee7b7; }

/* ── Splash ───────────────────────────────────────── */
.splash-screen {
  position:fixed; inset:0; z-index:200;
  background:var(--bg); display:flex; align-items:center; justify-content:center;
  flex-direction:column; gap:16px;
}
.splash-logo {
  width:80px; height:80px; border-radius:22px;
  background:var(--grad); display:flex; align-items:center; justify-content:center;
  font-family:'Space Grotesk',sans-serif; font-size:2.2rem; font-weight:800;
  box-shadow:0 8px 40px rgba(0,212,255,.4);
  animation: splashPop .8s cubic-bezier(.34,1.56,.64,1) forwards;
}
@keyframes splashPop { from{transform:scale(.3);opacity:0} to{transform:scale(1);opacity:1} }
.splash-name {
  font-family:'Space Grotesk',sans-serif; font-size:1.8rem; font-weight:800;
  background:var(--grad); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
  animation: fadeUp .6s ease .4s both;
}
.splash-tagline { font-size:.85rem; color:var(--text2); animation: fadeUp .6s ease .6s both; }
.splash-loader {
  width:40px; height:3px; border-radius:2px; background:var(--border);
  margin-top:32px; overflow:hidden; animation: fadeUp .4s ease .8s both;
}
.splash-loader-bar { height:100%; width:0; background:var(--grad); border-radius:2px; animation:loaderFill 1.2s ease 1s forwards; }
@keyframes loaderFill { to { width:100%; } }
@keyframes fadeUp { from{transform:translateY(16px);opacity:0} to{transform:none;opacity:1} }

/* ── Onboarding ───────────────────────────────────── */
.onboard-slides { display:flex; transition:transform .4s cubic-bezier(.4,0,.2,1); }
.onboard-slide {
  min-width:100%; padding:calc(var(--safe-top) + 40px) 28px 40px;
  display:flex; flex-direction:column; align-items:center; text-align:center;
}
.onboard-illo { width:180px; height:180px; margin:0 auto 32px; }
.onboard-title { font-family:'Space Grotesk',sans-serif; font-size:1.6rem; font-weight:800; margin-bottom:12px; }
.onboard-sub { font-size:.9rem; color:var(--text2); line-height:1.65; max-width:280px; }
.onboard-dots { display:flex; gap:6px; justify-content:center; padding:24px 0; }
.onboard-dot { width:6px; height:6px; border-radius:3px; background:var(--text3); transition:all .3s; }
.onboard-dot.active { width:20px; background:var(--cyan); }
.onboard-actions { padding:0 24px calc(var(--safe-bot) + 20px); display:flex; flex-direction:column; gap:10px; }

/* ── Transfer Numpad ──────────────────────────────── */
.numpad-amount {
  font-family:'Space Grotesk',sans-serif; font-size:3.5rem; font-weight:800;
  text-align:center; padding:32px 20px 16px;
  background:var(--grad); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
}
.numpad-currency { font-size:1.8rem; }
.numpad-grid {
  display:grid; grid-template-columns:repeat(3,1fr); gap:1px;
  background:var(--border); border:1px solid var(--border);
  border-radius:var(--radius); overflow:hidden; margin:0 16px 16px;
}
.numpad-key {
  background:var(--surface); padding:20px; text-align:center;
  font-size:1.3rem; font-weight:600; cursor:pointer; border:none;
  color:var(--text); font-family:'Space Grotesk',sans-serif;
  transition:background .12s;
}
.numpad-key:active { background:var(--card); }
.numpad-key.zero { grid-column:1; }
.numpad-key.del { color:var(--cyan); font-size:1.1rem; }

/* ── Cards Carousel ───────────────────────────────── */
.cards-carousel {
  display:flex; gap:14px; padding:0 16px 16px;
  overflow-x:auto; scroll-snap-type:x mandatory; scrollbar-width:none;
}
.cards-carousel::-webkit-scrollbar { display:none; }
.bank-card {
  min-width:calc(100vw - 56px); border-radius:var(--radius-xl);
  padding:24px; position:relative; overflow:hidden;
  scroll-snap-align:start; height:190px;
  display:flex; flex-direction:column; justify-content:space-between;
}
.bank-card-1 { background:linear-gradient(135deg, #0a1628 0%, #1a0a35 100%); border:1px solid rgba(0,212,255,.2); }
.bank-card-2 { background:linear-gradient(135deg, #0d1a15 0%, #0a1020 100%); border:1px solid rgba(16,185,129,.2); }
.bank-card::before {
  content:''; position:absolute; top:-30px; right:-30px;
  width:140px; height:140px; border-radius:50%;
  background:radial-gradient(circle, rgba(0,212,255,.15), transparent 70%);
}
.card-network { position:absolute; top:18px; right:18px; font-size:.75rem; font-weight:700; color:rgba(255,255,255,.6); letter-spacing:.06em; }
.card-type { font-size:.7rem; color:rgba(255,255,255,.5); text-transform:uppercase; letter-spacing:.1em; }
.card-balance { font-family:'Space Grotesk',sans-serif; font-size:1.5rem; font-weight:800; }
.card-number-row { font-family:monospace; font-size:.82rem; letter-spacing:.18em; color:rgba(255,255,255,.55); }
.card-info-row { display:flex; justify-content:space-between; }
.card-info-label { font-size:.58rem; color:rgba(255,255,255,.4); text-transform:uppercase; letter-spacing:.06em; margin-bottom:2px; }
.card-info-val { font-size:.78rem; font-weight:600; }

/* ── Card Actions ─────────────────────────────────── */
.card-actions { display:flex; gap:10px; padding:0 16px 16px; }
.card-action-btn {
  flex:1; padding:12px 8px; border-radius:var(--radius-sm);
  border:1px solid var(--border); background:var(--surface);
  color:var(--text); font-size:.75rem; font-weight:600;
  cursor:pointer; text-align:center; transition:all .2s;
  display:flex; flex-direction:column; align-items:center; gap:4px;
}
.card-action-btn:active { background:var(--card); border-color:rgba(0,212,255,.2); }
.card-action-icon { font-size:1.2rem; }

/* ── Sim Page ─────────────────────────────────────── */
.loan-tabs { display:flex; gap:6px; padding:0 16px 12px; overflow-x:auto; scrollbar-width:none; }
.loan-tabs::-webkit-scrollbar { display:none; }
.loan-tab {
  flex-shrink:0; padding:8px 16px; border-radius:999px;
  border:1px solid var(--border); background:transparent;
  font-size:.78rem; font-weight:600; color:var(--text2);
  cursor:pointer; transition:all .2s; font-family:'Inter',sans-serif;
}

// ─── API ──────────────────────────────────────────────────
const $api = {
  async req(method, path, body=null, auth=true) {
    const headers = { 'Content-Type':'application/json' };
    if (auth) {
      const t = localStorage.getItem('nb_token');
      if (t) headers['Authorization'] = `Bearer ${t}`;
    }
    try {
      const res = await fetch(API_URL + path, {
        method, headers, body: body ? JSON.stringify(body) : null
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.message || `Erreur ${res.status}`);
      return data;
    } catch(e) {
      throw e;
    }
  },
  get:  (p, a=true)    => $api.req('GET',    p, null, a),
  post: (p, b, a=true) => $api.req('POST',   p, b, a),
  put:  (p, b, a=true) => $api.req('PUT',    p, b, a),
};

// Auth helpers

function saveAuth(data) {
  localStorage.setItem('nb_token', data.accessToken||data.token||'');
  localStorage.setItem('nb_refresh', data.refreshToken||'');
  localStorage.setItem('nb_user', JSON.stringify(data.user||data));
}
function clearAuth() {
  ['nb_token','nb_refresh','nb_user'].forEach(k => localStorage.removeItem(k));
}

// ─── NAVIGATION ───────────────────────────────────────────
function nav(screen, dir='forward') {
  const prev = S.screen;
  if (dir !== 'back') S.history.push(prev);
  S.screen = screen;
  render(dir);
  updateTabBar();
}

function back() {
  const prev = S.history.pop();
  if (prev) { S.screen = prev; render('back'); updateTabBar(); }
  else nav('home', 'back');
}

const TABS = ['home','cards','transfer','simulator','profile'];
const TAB_SCREENS = new Set(TABS);

function updateTabBar() {
  const bar = document.getElementById('tab-bar');
  const authScreens = new Set(['splash','onboarding','login','register']);
  if (authScreens.has(S.screen) || !isLoggedIn()) {
    bar.classList.add('hidden');
  } else {
    bar.classList.remove('hidden');
    bar.querySelectorAll('.tab-item').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.tab === S.screen);
    });
  }
}

// ─── RENDER ENGINE ────────────────────────────────────────
function render(dir='forward') {
  const wrap = document.getElementById('screen-wrap');
  const animClass = dir === 'back' ? 'slide-in-left' : dir === 'replace' ? '' : 'slide-in-right';
  const screenHTML = buildScreen(S.screen);

  // Fade out old screen briefly
  const old = wrap.querySelector('.screen,.auth-screen');
  if (old && dir !== 'replace') {
    old.classList.add(dir === 'back' ? 'slide-out-right' : 'slide-out-left');
    setTimeout(() => old.remove(), 350);
  } else if (old) {
    old.remove();
  }

  const div = document.createElement('div');
  div.className = (S.screen === 'login' || S.screen === 'register' || S.screen === 'onboarding') ? 'auth-screen' : 'screen';
  if (animClass) div.classList.add(animClass);
  div.innerHTML = screenHTML;
  wrap.appendChild(div);

  // Bind events after render
  setTimeout(() => bindScreen(S.screen, div), 10);
}

// ── SIMULATOR ─────────────────────────────────────────────
function simulator() {
  const rate = RATES[S.loanType];
  const principal = S.simAmount;
  const months = S.simDuration;
  const r = rate / 100 / 12;
  const monthly = r ? principal * r * Math.pow(1+r,months) / (Math.pow(1+r,months)-1) : principal/months;
  const total = monthly * months;
  const interest = total - principal;
  const tabs = Object.entries(RATE_LABELS).map(([k,v]) => `
    <button class="loan-tab${S.loanType===k?' active':''}" data-lt="${k}">${v}</button>`).join('');
  return `
  <div class="app-header">
    <h1>Simulateur de crédit</h1>
  </div>
  <div class="loan-tabs" id="loanTypeTabs">${tabs}</div>
  <div class="sim-card">
    <div class="sim-slider-field">
      <div class="sim-slider-label"><span>Montant</span><span class="sim-slider-val" id="sAmtVal">€${principal.toLocaleString('fr-FR')}</span></div>
      <input type="range" id="sAmt" min="500" max="100000" value="${principal}" step="500"/>
    </div>
    <div class="sim-slider-field">
      <div class="sim-slider-label"><span>Durée</span><span class="sim-slider-val" id="sDurVal">${months} mois</span></div>
      <input type="range" id="sDur" min="6" max="84" value="${months}" step="6"/>
    </div>
    <div class="sim-slider-field" style="margin-bottom:0">
      <div class="sim-slider-label">
        <span>TAEG — ${RATE_LABELS[S.loanType]}</span>
        <span class="sim-slider-val" style="color:var(--purple)">${rate.toFixed(1)}% <em style="font-size:.7rem;color:var(--text3);">fixé</em></span>
      </div>
      <input type="range" min="1" max="5" value="${rate}" step="0.1" disabled style="opacity:.3;pointer-events:none;"/>
    </div>
  </div>
  <div class="sim-result-card">

    <div class="sim-monthly-val" id="sMonthly">€${monthly.toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})}</div>
    <div style="font-size:.78rem;color:var(--text2);margin-top:4px;">par mois pendant ${months} mois</div>

    </div>
  </div>
  <div class="section-pad" style="padding-bottom:24px;">

function txItem(t) {

  return `

    <div class="tx-info">
      <div class="tx-name">${t.description}</div>

    </div>
    <div class="tx-amount ${cls}">${sign}€${t.amount.toLocaleString('fr-FR',{minimumFractionDigits:2})}</div>
  </div>`;
}

// ─── BIND EVENTS ──────────────────────────────────────────
function bindScreen(name, root) {
  const $ = (id) => root.querySelector('#'+id);
  const on = (id, ev, fn) => { const el=$(id); if(el) el.addEventListener(ev,fn); };

  if (name === 'onboarding') {
    on('ob-next', 'click', () => { S.onboardStep=Math.min(2,S.onboardStep+1); render('replace'); bindScreen('onboarding',document.querySelector('.auth-screen')); });
    on('ob-skip', 'click', () => { localStorage.setItem('nb_onboarded','1'); nav('login'); });
    on('ob-start','click', () => { localStorage.setItem('nb_onboarded','1'); nav('register'); });
    on('ob-login','click', () => { localStorage.setItem('nb_onboarded','1'); nav('login'); });
  }

  if (name === 'login') {
    on('togglePwd','click', () => {
      const p=$('loginPwd'); if(p) p.type = p.type==='password'?'text':'password';
    });
    on('goRegister','click', () => nav('register'));

    on('loginBtn','click', async () => {
      const btn=$('loginBtn'), err=$('loginErr');
      const email=$('loginEmail')?.value.trim();
      const pwd=$('loginPwd')?.value;
      if(!email||!pwd){ err.textContent='Veuillez remplir tous les champs'; err.style.display='block'; return; }
      btn.textContent='Connexion...'; btn.disabled=true;
      try {
        const data = await $api.post('/auth/login',{email,password:pwd},false);
        saveAuth(data); S.user = data.user;
        await loadUserData();
        nav('home');
      } catch(e) {
        err.textContent = e.message||'Erreur de connexion'; err.style.display='block';
        btn.textContent='Se connecter'; btn.disabled=false;
      }
    });
  }

  if (name === 'register') {
    on('regBack','click', () => back());
    on('goLogin','click', () => nav('login','back'));
    on('toggleRegPwd','click', () => {
      const p=$('regPwd'); if(p) p.type=p.type==='password'?'text':'password';
    });
    on('regBtn','click', async () => {
      const btn=$('regBtn'), err=$('regErr'), ok=$('regOk');
      const first=$('regFirst')?.value.trim(), last=$('regLast')?.value.trim();
      const email=$('regEmail')?.value.trim(), phone=$('regPhone')?.value.trim();
      const pwd=$('regPwd')?.value, pwd2=$('regPwd2')?.value;
      const terms=$('regTerms')?.checked;
      if(!first||!last||!email||!pwd){ err.textContent='Veuillez remplir les champs obligatoires'; err.style.display='block'; return; }
      if(pwd!==pwd2){ err.textContent='Les mots de passe ne correspondent pas'; err.style.display='block'; return; }
      if(!terms){ err.textContent="Veuillez accepter les conditions générales"; err.style.display='block'; return; }
      err.style.display='none';
      btn.textContent='Création...'; btn.disabled=true;
      const body = { firstName:first, lastName:last, email, password:pwd, confirmPassword:pwd2 };
      if(phone) body.phone=phone;
      try {
        const data = await $api.post('/auth/register',body,false);
        saveAuth(data); S.user=data.user;
        await loadUserData();
        nav('home');
      } catch(e) {
        err.textContent=e.message||'Erreur lors de l\'inscription'; err.style.display='block';
        btn.textContent='Créer mon compte'; btn.disabled=false;
      }
    });
  }

  if (name === 'home') {
    on('seeAllTx','click', () => nav('transactions'));
    on('notifBtn','click', () => toast('Aucune nouvelle notification','info'));
    root.querySelectorAll('[data-action]').forEach(btn => {
      btn.addEventListener('click', () => nav(btn.dataset.action));
    });
  }

  if (name === 'transactions') {
    on('txBack','click', () => back());
    root.querySelectorAll('.filter-tab').forEach(btn => {
      btn.addEventListener('click', () => { S.filterTx=btn.dataset.filter; render('replace'); bindScreen('transactions',document.querySelector('.screen')); });
    });
    on('txSearch','input', function() {
      const q=this.value.toLowerCase();
      root.querySelectorAll('.tx-item').forEach(item => {
        item.style.display = item.querySelector('.tx-name')?.textContent.toLowerCase().includes(q)?'':'none';
      });
    });
  }

  if (name === 'transfer') {
    on('trBack','click', () => back());
    root.querySelectorAll('.numpad-key').forEach(btn => {
      btn.addEventListener('click', () => {
        const k = btn.dataset.k;
        if (k==='del') S.transferAmount=S.transferAmount.slice(0,-1);
        else if (k==='.' && S.transferAmount.includes('.')) return;
        else if (S.transferAmount.length < 10) S.transferAmount+=k;
        const disp=document.querySelector('.numpad-amount');
        if(disp) {
          const v=parseFloat(S.transferAmount||'0');
          disp.innerHTML=`<span class="numpad-currency">€</span>${v.toLocaleString('fr-FR',{minimumFractionDigits:S.transferAmount.includes('.')?2:0})}`;
        }
      });
    });
    on('trSend','click', async () => {
      const amt=parseFloat(S.transferAmount||'0');
      const recip=$('trRecipient')?.value.trim();
      const note=$('trNote')?.value.trim();
      if(amt<=0){toast('Saisissez un montant valide','error');return;}
      if(!recip){toast('Indiquez un bénéficiaire','error');return;}
      const btn=$('trSend'); btn.textContent='Envoi...'; btn.disabled=true;
      try {
        await $api.post('/transactions/transfer',{toEmail:recip,amount:amt,description:note||'Virement NeoBank'});
        S.transferAmount='';
        toast('Virement effectué avec succès !','success');
        await loadUserData(); back();
      } catch(e){ toast(e.message||'Erreur lors du virement','error'); btn.textContent='Envoyer →'; btn.disabled=false; }
    });
  }

  if (name === 'simulator') {
    root.querySelectorAll('[data-lt]').forEach(btn => {
      btn.addEventListener('click', () => {
        S.loanType=btn.dataset.lt;
        root.querySelectorAll('[data-lt]').forEach(b=>b.classList.toggle('active',b===btn));
        updateSim(root);
      });
    });
    on('sAmt','input', function(){ S.simAmount=parseInt(this.value); updateSim(root); });
    on('sDur','input', function(){ S.simDuration=parseInt(this.value); updateSim(root); });
    on('applyLoanBtn','click', () => nav('loan_apply'));
  }

  if (name === 'loan_apply') {
    on('laBack','click', () => back());
    on('laSubmit','click', async () => {
      const btn=$('laSubmit'), err=$('laErr'), ok=$('laOk');
      const purpose=$('laPurpose')?.value.trim();
      const income=parseFloat($('laIncome')?.value||0);
      if(!purpose||!income){err.textContent='Veuillez remplir tous les champs requis';err.style.display='block';return;}
      err.style.display='none'; btn.textContent='Envoi...'; btn.disabled=true;
      try {
        await $api.post('/loans/apply',{type:S.loanType,amount:S.simAmount,duration:S.simDuration,purpose,monthlyIncome:income});
        ok.textContent='✓ Demande soumise ! Réponse de principe sous 24h.'; ok.style.display='block';
        btn.style.display='none';
      } catch(e){ err.textContent=e.message||'Erreur'; err.style.display='block'; btn.textContent='Soumettre'; btn.disabled=false; }
    });
  }

  if (name === 'profile') {
    on('logoutBtn','click', async () => {
      try { if(localStorage.getItem('nb_token')!=='demo') await $api.post('/auth/logout',{}); } catch{}
      clearAuth(); S.user=null; S.account=null; S.transactions=[];
      nav('login','back');
    });
  }
}

// ─── SIM UPDATE ───────────────────────────────────────────
function updateSim(root) {
  const rate=RATES[S.loanType], r=rate/100/12;
  const monthly=r?S.simAmount*r*Math.pow(1+r,S.simDuration)/(Math.pow(1+r,S.simDuration)-1):S.simAmount/S.simDuration;
  const total=monthly*S.simDuration, interest=total-S.simAmount;
  const fmtE=n=>'€'+n.toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2});
  const $ = id=>root.querySelector('#'+id);
  if($('sAmtVal'))   $('sAmtVal').textContent   = '€'+S.simAmount.toLocaleString('fr-FR');
  if($('sDurVal'))   $('sDurVal').textContent   = S.simDuration+' mois';
  if($('sMonthly'))  $('sMonthly').textContent  = fmtE(monthly);
  // update result rows
  const rows=root.querySelectorAll('.sim-result-row span:last-child');
  if(rows[0]) rows[0].textContent='€'+S.simAmount.toLocaleString('fr-FR');
  if(rows[1]) rows[1].textContent=fmtE(total);
  if(rows[2]){ rows[2].textContent=fmtE(interest); rows[2].style.color='var(--warn)'; }
  if(rows[3]){ rows[3].textContent=rate.toFixed(1)+'%'; rows[3].style.color='var(--cyan)'; }
}

// ─── LOAD DATA ────────────────────────────────────────────
async function loadUserData() {

  try {
    const [me, acc, txs] = await Promise.allSettled([
      $api.get('/auth/me'),
      $api.get('/accounts/me'),
      $api.get('/transactions?limit=20')
    ]);
    if(me.status==='fulfilled') { S.user=me.value.user||me.value; localStorage.setItem('nb_user',JSON.stringify(S.user)); }
    if(acc.status==='fulfilled') S.account=acc.value.account||acc.value;
    if(txs.status==='fulfilled') S.transactions=txs.value.transactions||txs.value||[];
    // fallback to mock if empty
    if(!S.account) S.account=MOCK_ACCOUNT;
    if(!S.transactions.length) S.transactions=MOCK_TX;
  } catch(e) {
    S.account=MOCK_ACCOUNT; S.transactions=MOCK_TX;
  }
}

// ─── TOAST ────────────────────────────────────────────────
function toast(msg, type='info') {
  const wrap=document.getElementById('toast-wrap');
  const icons={success:'✅',error:'❌',info:'ℹ️'};
  const el=document.createElement('div');
  el.className=`app-toast toast-${type}`;
  el.innerHTML=`<span>${icons[type]||'ℹ️'}</span><span>${msg}</span>`;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transform='translateY(-8px)'; el.style.transition='all .3s'; setTimeout(()=>el.remove(),300); }, 3000);
}

// ─── HELPERS ──────────────────────────────────────────────
const delay = ms => new Promise(r=>setTimeout(r,ms));

// ─── TAB BAR EVENTS ───────────────────────────────────────
document.querySelectorAll('[data-tab]').forEach(btn => {
  btn.addEventListener('click', () => nav(btn.dataset.tab));
});

// ─── BOOT ─────────────────────────────────────────────────
render('replace');
</script>

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
